---
name: Regression tests

on:
  pull_request:
    paths:
      - .github/workflows/regression-test-on-push.yaml
      - .github/workflows/regression-test.yaml
      - glass/**
    branches:
      - main
    types:
      - labeled
      - opened
      - ready_for_review
      - reopened
      - synchronize

jobs:
  regression-tests-on-push:
    if: github.event.pull_request.draft == false
    name: On push
    permissions:
      contents: read
    uses: $/.github/workflows/regression-test.yaml
